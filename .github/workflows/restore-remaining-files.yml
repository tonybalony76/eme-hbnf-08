name: Restore remaining FNF files

on:
  push:
    branches: [main]
    paths:
      - 'FNF-Missing-Files-Part-*.zip'
      - '.github/workflows/restore-remaining-files.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract all missing-file ZIP parts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib

          root = Path(".").resolve()
          archives = sorted(root.glob("FNF-Missing-Files-Part-*.zip"))
          if not archives:
              raise SystemExit("No FNF-Missing-Files-Part-*.zip files found.")

          restored = 0
          already = 0
          for archive in archives:
              print(f"Extracting {archive.name}")
              with ZipFile(archive) as z:
                  for item in z.infolist():
                      if item.is_dir():
                          continue
                      rel = Path(item.filename)
                      if rel.is_absolute() or ".." in rel.parts:
                          raise SystemExit(f"Unsafe archive path: {item.filename}")
                      dest = (root / rel).resolve()
                      if root not in dest.parents:
                          raise SystemExit(f"Unsafe destination: {item.filename}")
                      data = z.read(item)
                      if dest.exists():
                          if hashlib.sha256(dest.read_bytes()).digest() != hashlib.sha256(data).digest():
                              raise SystemExit(f"Conflict: {item.filename} already exists with different content.")
                          already += 1
                          continue
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      dest.write_bytes(data)
                      restored += 1
              archive.unlink()

          print(f"Restored: {restored}")
          print(f"Already present identically: {already}")
          print(f"ZIP parts processed: {len(archives)}")
          PY

      - name: Commit restored files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Restore remaining FNF files"
          git push
