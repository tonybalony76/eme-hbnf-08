name: Diagnose FNF compiled event registry

on:
  push:
    paths:
      - .github/workflows/diagnose-event-registry.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Inspect compiled JavaScript and class-list metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("Funkin.js")
          if not path.is_file():
              raise SystemExit("Funkin.js is missing from this branch")

          source = path.read_text(encoding="utf-8")
          report = [
              "FNF compiled event-registry analysis",
              f"File: {path}",
              f"Bytes: {path.stat().st_size}",
              f"Lines: {len(source.splitlines())}",
              "",
          ]

          # Extract and fully decode the Haxe class-list resource. The previous
          # report excerpt cut this long base64 value off mid-string.
          resource = re.search(
              r'\{\s*name\s*:\s*"Funkin_CompiledClassList",\s*data\s*:\s*"([^"]+)"',
              source
          )
          if resource:
              import base64
              encoded = resource.group(1)
              decoded = base64.b64decode(encoded).decode("utf-8", errors="replace")
              report.append(f"CompiledClassList base64 bytes: {len(encoded)}")
              report.append(f"CompiledClassList decoded chars: {len(decoded)}")

              pos = 0
              def unserialize():
                  nonlocal_pos = None
                  global_pos = None
                  nonlocal_dummy = None
                  global_dummy = None
                  nonlocal pos
                  if pos >= len(decoded):
                      raise ValueError("unexpected end of class-list resource")
                  code = decoded[pos]
                  pos += 1
                  if code == "a":
                      items = []
                      while pos < len(decoded) and decoded[pos] != "h":
                          items.append(unserialize())
                      if pos >= len(decoded):
                          raise ValueError("unterminated array")
                      pos += 1
                      return items
                  if code == "y":
                      end = decoded.index(":", pos)
                      length = int(decoded[pos:end])
                      pos = end + 1
                      value = decoded[pos:pos + length]
                      if len(value) != length:
                          raise ValueError("truncated string value")
                      pos += length
                      return value
                  if code == "n":
                      return None
                  if code == "t":
                      return True
                  if code == "f":
                      return False
                  if code == "i":
                      end = pos
                      while end < len(decoded) and decoded[end] in "-0123456789":
                          end += 1
                      value = int(decoded[pos:end])
                      pos = end
                      return value
                  raise ValueError(f"unsupported Haxe serialization code {code!r} at {pos - 1}")

              try:
                  metadata = unserialize()
                  rows = metadata if isinstance(metadata, list) else []
                  registered = set(re.findall(
                      r'\$hxClasses\["([^"]+)"\]\s*=', source
                  ))
                  report.append(f"Parsed metadata rows: {len(rows)}")
                  event_rows = [
                      row for row in rows
                      if isinstance(row, list) and row
                      and isinstance(row[0], str)
                      and ("SongEvent" in row[0] or "funkin.play.event" in row[0])
                  ]
                  report.append(f"SongEvent-related metadata rows: {len(event_rows)}")
                  for row in event_rows:
                      classes = [x for x in row[1:] if isinstance(x, str)]
                      missing = [name for name in classes if name not in registered]
                      report.append(f"ROW: {row[0]}")
                      report.append(f"  class count: {len(classes)}")
                      report.append(f"  unregistered classes: {missing}")
                  report.append(f"Class-list parser stopped at: {pos}/{len(decoded)}")
                  report.append(f"Remaining decoded chars: {decoded[pos:pos + 100]!r}")
              except Exception as error:
                  report.append(f"Class-list parse error: {type(error).__name__}: {error}")
                  report.append(f"Parser position: {pos}/{len(decoded)}")
          else:
              report.append("ERROR: CompiledClassList resource not found in Funkin.js")

          # The startup code checks WebGL/OpenGL explicitly before creating the
          # game. Preserve that branch in the diagnostic report.
          webgl_at = source.find('Failed to initialize " + "WebGL')
          if webgl_at >= 0:
              report.append("")
              report.append("WebGL startup branch:")
              report.append(source[max(0, webgl_at - 700):webgl_at + 700])

          report.append("")
              "FNF compiled event-registry analysis",
              f"File: {path}",
              f"Bytes: {path.stat().st_size}",
              f"Lines: {len(source.splitlines())}",
              "",
          ]

          # Inspect path/base-URL selection in the generated Lime/OpenFL bundle.
          terms = [
              "document.currentScript", "document.scripts", "document.location",
              "window.location", "location.href", "location.pathname",
              "document.baseURI", "baseURI", "getElementsByTagName(\"script\")",
              "XMLHttpRequest", "assets/", "Funkin.js", "lime.embed",
              "window.fetch", "new URL("
          ]
          for term in terms:
              positions = []
              start = 0
              while True:
                  pos = source.find(term, start)
                  if pos < 0:
                      break
                  positions.append(pos)
                  start = pos + len(term)
              report.append(f"{term}: {len(positions)} occurrence(s)")
              for i, pos in enumerate(positions[:8], 1):
                  report.append(f"--- {term} occurrence {i} @ {pos} ---")
                  report.append(source[max(0, pos - 350):min(len(source), pos + 550)])
                  report.append("")

          # The serialized class-list resource is read at runtime. Show where
          # the resource is stored as well as the code that requests it.
          key = "Funkin_CompiledClassList"
          positions = []
          start = 0
          while True:
              pos = source.find(key, start)
              if pos < 0:
                  break
              positions.append(pos)
              start = pos + len(key)

          report.append(f"Resource-name occurrences: {len(positions)}")
          for i, pos in enumerate(positions, 1):
              report.append(f"--- resource occurrence {i}, offset {pos} ---")
              report.append(source[max(0, pos - 1200):min(len(source), pos + 9000)])
              report.append("")

          # Compare event class names mentioned in the serialized data to
          # class registrations without fragile regular expressions.
          marker = "funkin.play.event."
          names = set()
          pos = 0
          while True:
              pos = source.find(marker, pos)
              if pos < 0:
                  break
              end_name = pos
              while end_name < len(source) and (source[end_name].isalnum() or source[end_name] in "._"):
                  end_name += 1
              name = source[pos:end_name].rstrip(".")
              if name and name != "funkin.play.event":
                  names.add(name)
              pos = end_name + 1

          report.append(f"Event class names mentioned: {len(names)}")
          for name in sorted(names):
              registered = ('$hxClasses["' + name + '"]') in source
              report.append(("REGISTERED: " if registered else "NOT REGISTERED: ") + name)

          # Show contexts around runtime URL and renderer initialization code.
          terms = [
              "document.currentScript", "document.scripts", "document.baseURI",
              "location.href", "location.pathname", "new URL(", "lime.embed",
              "WebGL", "webgl", "assets/", "Funkin.js", "XMLHttpRequest"
          ]
          report.append("")
          report.append("Runtime URL/renderer code references:")
          for term in terms:
              positions = []
              start_at = 0
              while True:
                  found = source.find(term, start_at)
                  if found < 0:
                      break
                  positions.append(found)
                  start_at = found + len(term)
              report.append(f"{term}: {len(positions)} occurrence(s)")
              for i, found in enumerate(positions[:4], 1):
                  report.append(f"--- {term} occurrence {i} @ {found} ---")
                  report.append(source[max(0, found - 350):min(len(source), found + 650)])
                  report.append("")

          Path("FNF-REGISTRY-DIAGNOSTIC.txt").write_text(
              "\n".join(report), encoding="utf-8"
          )
          print("\n".join(report[:40]))
          PY

      - name: Save diagnostic report on this branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FNF-REGISTRY-DIAGNOSTIC.txt
          git commit -m "Analyze missing FNF event registry classes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
