name: Restore Part 08 folders

on:
  push:
    branches: [main]
    paths:
      - 'FNF-Part-08-Missing-Files.zip.zip'
      - '.github/workflows/restore-part08-folders.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract and normalize Part 08 files
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from io import BytesIO

          root = Path(".").resolve()
          with ZipFile("FNF-Part-08-Missing-Files.zip.zip") as outer:
              names = [n for n in outer.namelist() if not n.endswith("/")]
              for name in names:
                  if name.endswith("cursor-files.zip.zip"):
                      with ZipFile(BytesIO(outer.read(name))) as inner:
                          for item in inner.namelist():
                              if item.endswith("/"):
                                  continue
                              dest = root / "assets/images/cursor" / Path(item).name
                              dest.parent.mkdir(parents=True, exist_ok=True)
                              dest.write_bytes(inner.read(item))
                      continue

                  relative = name
                  if relative.startswith("FNF-Part-08/"):
                      relative = relative[len("FNF-Part-08/"):]
                  if relative.startswith("assets/images/pauseAlt/"):
                      relative = relative.replace("assets/images/pauseAlt/", "assets/shared/images/pauseAlt/", 1)
                  if relative.startswith("assets/manifest/"):
                      relative = relative[len("assets/"):]
                  dest = (root / relative).resolve()
                  if root not in dest.parents:
                      raise SystemExit(f"Unsafe path: {name}")
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(outer.read(name))

          print("Extracted and normalized Part 08 files.")
          PY

      - name: Commit restored files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- assets manifest
          git diff --cached --quiet && exit 0
          git commit -m "Restore Part 08 missing files"
          git push
