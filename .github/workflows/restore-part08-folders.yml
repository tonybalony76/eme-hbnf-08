name: Restore Part 08 folders

on:
  push:
    branches: [main]
    paths:
      - 'FNF-Part-08-Missing-Files.zip.zip'
      - '.github/workflows/restore-part08-folders.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract files with original folders
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path("FNF-Part-08-Missing-Files.zip.zip")
          root = Path(".").resolve()

          with ZipFile(archive) as z:
              names = [n for n in z.namelist() if not n.endswith("/")]
              prefix = "FNF-Part-08/" if names and all(n.startswith("FNF-Part-08/") for n in names) else ""
              for name in names:
                  relative = name[len(prefix):]
                  target = (root / relative).resolve()
                  if not relative or root not in target.parents:
                      raise SystemExit(f"Unsafe archive path: {name}")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(name) as source, target.open("wb") as dest:
                      dest.write(source.read())

          print(f"ZIP entries: {len(names)}")
          for name in names:
              print(name)
          PY

      - name: Commit restored folders
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for directory in assets manifest; do
            if [ -d "$directory" ]; then
              git add -A -- "$directory"
            fi
          done
          if git diff --cached --quiet; then
            echo "No restored file changes to commit."
            exit 0
          fi
          git commit -m "Restore Part 08 files with original folders"
          git push
