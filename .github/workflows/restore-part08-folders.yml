name: Restore Part 08 folders

on:
  push:
    branches: [main]
    paths:
      - 'FNF-Part-08-Missing-Files.zip.zip'
      - '.github/workflows/restore-part08-folders.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract files with original folders
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path("FNF-Part-08-Missing-Files.zip.zip")
          root = Path(".").resolve()

          with ZipFile(archive) as z:
              names = [n for n in z.namelist() if not n.endswith("/")]
              prefixes = ("FNF-Part-08/",)
              prefix = next((p for p in prefixes if names and all(n.startswith(p) for n in names)), "")
              for name in names:
                  relative = name[len(prefix):]
                  target = (root / relative).resolve()
                  if not relative or root not in target.parents:
                      raise SystemExit(f"Unsafe archive path: {name}")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(name) as source, target.open("wb") as dest:
                      dest.write(source.read())

          print(f"Restored {len(names)} files; wrapper folder: {prefix or '(none)'}")
          PY

      - name: Commit restored folders
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- assets manifest
          git diff --cached --quiet && exit 0
          git commit -m "Restore Part 08 files with original folders"
          git push
